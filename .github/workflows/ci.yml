# Runs the checks AGENTS.md §4 requires, one step per command so a failure
# is visible at a glance in the Actions UI. `cargo xtask ci` (xtask/src/main.rs)
# runs the same commands, in the same order, for a one-shot local check
# before pushing — this file and that list are meant to be kept in sync by
# hand, since neither can include the other.
#
# Only first-party GitHub Actions are used (actions/checkout, actions/cache),
# so there's no third-party Action to audit or pin by commit SHA. The
# toolchain itself is pinned to a specific version (see AGENTS.md §12 Phase 0:
# "toolchain pinned in CI only, not via rust-toolchain.toml" — dev machines
# stay on whatever stable they have; CI is reproducible).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.96.1
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets --locked -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - name: cargo doc --workspace --no-deps
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
